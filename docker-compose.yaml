  postgres:
    image: postgres:16-alpine
    container_name: valo-postgres
    env_file: .env.docker
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck: # Thêm healthcheck để app biết chính xác khi nào database đã sẵn sàng nhận kết nối
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valo-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: valo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - valo-network
    restart: unless-stopped

